H = ["#"]
i = ["1", "!"]
I = ["1", "!"]
l = ["1", "|"]
L = ["1", "|"]
n = ["~"]
N = ["~"]
o = ["0"]
O = ["0"]
r = ["2"]
R = ["2"]
s = ["5", "$"]
S = ["5", "$"]
t = ["7", "+"]
