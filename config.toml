# ─────────────────────────────────────────────────────────────────────────────
# WordlistTool — config.toml
# ─────────────────────────────────────────────────────────────────────────────
# Controls the built-in data used during candidate generation.
# Pass to the tool with:  wordlisttool generate keywords.txt -config config.toml
# Or place next to the binary and it will be loaded automatically.

# ── Symbols ──────────────────────────────────────────────────────────────────
# Used in various combinations when appending/prepending to keywords.

# All symbols — broad set used for standalone references
symbols = [
  "!", "@", "#", "$", "%", "^", "&", "*",
  "~", "`", "+", "=", "?", "/", "\\", "|",
  "(", ")", "[", "]", "{", "}", "<", ">",
  ".", ",", ";", ":", "'", '"',
  "!!", "@@", "##", "$$", "%%", "**",
  "!@", "@!", "#!", "!#", "$!", "!$",
  "!@#", "#@!", "!@#$", "$#@!", "!@#$%",
  "!@#$%^", "!@#$%^&", "!@#$%^&*",
  "*!", "!*", "@#", "#$", "$%", "%^", "^&", "&*",
  "!1", "!2", "@1", "@2", "#1", "#2",
  "!!", "!?", "?!", "!@!", "@!@", "#!#",
  "!#$", "$#!", "!$!", "$!$",
  "...", "---", "___", "***", "###",
]

# Compact symbol set — used in cross-product combinations to limit explosion
symbols_compact = [
  "!", "@", "#", "$", "*", "%", "^", "&",
  "!!", "!@#", "!@", "@!", "#!",
]

# Extended symbol set — used for direct single append/prepend
symbols_extended = [
  "!", "@", "#", "$", "%", "^", "&", "*", "~",
  "!!", "@@", "##", "$$", "**",
  "!@", "@!", "#!", "!#", "$!",
  "!@#", "#@!", "!@#$", "$#@!",
  "!@#$%", "!@#$%^", "!@#$%^&", "!@#$%^&*",
  "!1", "@2", "#3", "$4", "%5",
  "!?", "?!", "...", "---", "___",
  "!!!", "@@@", "###", "$$$",
]

