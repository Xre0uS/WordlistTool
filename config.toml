# ── Year ranges ──────────────────────────────────────────────────────────────
# Full years (e.g. 1950, 2026) and two-digit short years (e.g. 00, 26, 99)
# are generated from these ranges and used in append/prepend/patterns.

[years]
full_start  = 1950   # start of 4-digit year range (inclusive)
full_end    = 2050   # end of 4-digit year range (inclusive)
short_start = 0      # first 2-digit short year range: 00–50
short_end   = 50
short_start2 = 70    # second 2-digit short year range: 70–99
short_end2   = 99

# ── Pattern building ─────────────────────────────────────────────────────────
# These lists are cross-multiplied to build the "common patterns" pool
# (e.g. "!2026", "2026!", "#123$", "!@#2027", "27!@#").

[patterns]
# Symbols crossed with every year and digit
symbols = ["!", "@", "#", "$", "%", "*", "!!", "!@#", "!@", "@!"]

# Symbol pairs crossed with pattern_numbers: s1 + number + s2
symbol_pairs = ["!", "@", "#", "$", "%", "*"]

# Multi-char symbol strings crossed with pattern_years
multi_symbols = ["!@#", "!@#$", "#@!", "$#@!", "!@#$%"]

# Numbers used in symbol-pair patterns
numbers = [
  "1", "2", "3", "12", "13", "21", "23",
  "123", "321", "1234", "4321",
  "2027", "2026", "2025", "2024", "2023",
  "27", "26", "25", "24", "23",
]

# Years used in multi-symbol patterns
years = ["2024", "2025", "2026", "2027", "24", "25", "26", "27"]

# ── Leet speak substitutions ─────────────────────────────────────────────────
# Maps each character to its possible l33t replacements.
# Both cases are listed so that leet works regardless of input case.

[leet]
a = ["@", "4"]
A = ["@", "4"]
b = ["8"]
B = ["8"]
c = ["("]
C = ["("]
d = ["|"]
D = ["|"]
